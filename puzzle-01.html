<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PROJECT HELIX // 001</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #080a0d;
        color: #e6e9ed;
        font-family: monospace;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        width: 90%;
        max-width: 700px;
        text-align: center;
    }

    .file {
        color: #555b63;
        font-size: 12px;
        letter-spacing: 3px;
        margin-bottom: 45px;
    }

    h1 {
        font-size: 28px;
        font-weight: 400;
        letter-spacing: 5px;
    }

    .line {
        height: 1px;
        background: #343940;
        margin: 30px 0;
    }

    .message {
        color: #9aa1aa;
        font-size: 15px;
        line-height: 2;
        letter-spacing: 1px;
    }

    .cipher {
        margin: 40px 0 25px;
        padding: 25px;
        border: 1px solid #343940;
        font-size: 25px;
        letter-spacing: 7px;
    }

    .hint {
        color: #555b63;
        font-size: 11px;
        line-height: 1.8;
        letter-spacing: 2px;
    }

    .continue {
        display: inline-block;
        margin-top: 40px;
        padding: 12px 25px;
        border: 1px solid #69717b;
        color: #e6e9ed;
        text-decoration: none;
        letter-spacing: 3px;
    }

    .continue:hover {
        background: #e6e9ed;
        color: #080a0d;
    }
</style>
</head>

<body>

<div class="container">

    <div class="file">
        HELIX RESEARCH INITIATIVE // FILE 001
    </div>

    <h1>FIRST LAYER</h1>

    <div class="line"></div>

    <div class="message">
        THE MESSAGE HAS BEEN SHIFTED.<br><br>
        RETURN IT TO ITS ORIGINAL FORM.
    </div>

    <div class="cipher">
        KHOOR
    </div>

    <div class="hint">
        THE SHIFT IS THREE.<br>
        MOVE EACH LETTER BACKWARDS.
    </div>

    <a class="continue" href="puzzle-02.html">
        CONTINUE
    </a>

</div>

</body>
</html>
